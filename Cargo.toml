[workspace]
resolver = "3"
members = ["core/zelamar-core", "app/rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "LicenseRef-Proprietary"
repository = "https://github.com/Zelamar/zelamar"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
dbg_macro = "warn"
print_stdout = "warn"
print_stderr = "warn"
todo = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Dependencies (post-quantum crypto, SQLite) run optimized even in debug builds
# and tests, which keeps the test suite fast; our own code stays debuggable.
[profile.dev.package."*"]
opt-level = 2
