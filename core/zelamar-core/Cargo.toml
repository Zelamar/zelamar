[package]
name = "zelamar-core"
description = "The platform-independent heart of Zelamar: identity, encryption, storage and transports."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ciborium = "0.2.2"
openmls = { version = "0.9.1", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_basic_credential = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_rust_crypto = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
openmls_traits = { version = "0.6.0", features = ["draft-ietf-mls-pq-ciphersuites"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
thiserror = "2.0.21"

[dev-dependencies]
proptest = "1.12.0"
