name: App (Flutter)

on:
  pull_request:
    # ready_for_review: a draft PR turning ready runs the expensive jobs once.
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "app/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

defaults:
  run:
    working-directory: app

jobs:
  analyze-test:
    name: format · analyze · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain (app/rust/rust-toolchain.toml)
        working-directory: app/rust
        run: rustup toolchain install

      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver hook

      - name: Static analysis (infos are errors)
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test

  windows:
    name: Windows · integration test · release build
    needs: analyze-test
    # Expensive (Windows minutes bill 2×): skipped while a PR is a draft.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain
        working-directory: app/rust
        run: rustup toolchain install

      - name: Verified libwebrtc (flutter_webrtc would fetch it unchecked)
        shell: bash
        run: flutter pub get && bash tool/libwebrtc.sh

      - name: Integration test (real Rust core)
        run: flutter test integration_test/app_test.dart -d windows

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Local delivery service
        working-directory: server
        shell: bash
        env:
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm ci
          key=$(openssl rand -hex 32)
          echo "INVITE_KEY=$key" > .dev.vars
          # Two invites per attempt of the call test.
          invites=$(INVITE_KEY=$key node scripts/invites.mjs 1 4 | awk '{print $2}' | paste -sd, -)
          echo "ZELAMAR_TEST_INVITES=$invites" >> "$GITHUB_ENV"
          nohup npx wrangler dev --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/wrangler.log"
          exit 1

      - name: A real call between two people (ADR-0019)
        shell: bash
        # flutter_tools on Windows sometimes fails to delete its own
        # listener directory after a passing test (PathNotFoundException,
        # exit 79), and leaves the app running: one more try, with the app
        # closed first. A real failure fails twice.
        run: |
          for attempt in 1 2; do
            taskkill //F //IM zelamar.exe > /dev/null 2>&1 || true
            pair=$(cut -d, -f$((attempt * 2 - 1))-$((attempt * 2)) <<< "$ZELAMAR_TEST_INVITES")
            flutter test integration_test/call_test.dart -d windows \
              --dart-define=ZELAMAR_SERVICE=http://127.0.0.1:8787 \
              --dart-define=ZELAMAR_TEST_INVITES="$pair" && exit 0
          done
          exit 1

      - name: Service log
        if: failure()
        shell: bash
        run: tail -n 60 "$RUNNER_TEMP/wrangler.log" || true

      - name: Release build
        run: flutter build windows --release

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zelamar-windows-x64
          path: app/build/windows/x64/runner/Release/
          retention-days: 14

  ios:
    name: iOS · simulator integration test
    needs: analyze-test
    # Expensive (macOS minutes): skipped while a PR is a draft.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain (incl. iOS targets)
        working-directory: app/rust
        run: rustup toolchain install

      - name: Boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available --json | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(d["udid"] for runtime, list_ in sorted(devices.items(), reverse=True)
                     if "iOS" in runtime for d in list_ if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$udid"
          echo "SIMULATOR=$udid" >> "$GITHUB_ENV"

      - name: Integration test (real Rust core, Keychain)
        run: flutter test integration_test/app_test.dart -d "$SIMULATOR"

  android:
    name: Android · emulator integration test
    needs: analyze-test
    # Expensive (~10 min): skipped while a PR is a draft.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The emulator needs several GB for its userdata partition; Rust, Gradle
      # and Flutter fill the default runner disk. Drop toolchains we never use.
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain (incl. Android targets)
        working-directory: app/rust
        run: rustup toolchain install

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: flutter pub get

      - name: Integration test on emulator (real Rust core, screenshots)
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          working-directory: app
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: android-screenshots
          path: app/screenshots/
          if-no-files-found: warn
          retention-days: 14
