name: App (Flutter)

on:
  pull_request:
    paths:
      - "app/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "core/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - ".github/workflows/app.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

defaults:
  run:
    working-directory: app

jobs:
  analyze-test:
    name: format · analyze · unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain (app/rust/rust-toolchain.toml)
        working-directory: app/rust
        run: rustup toolchain install

      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test test_driver hook

      - name: Static analysis (infos are errors)
        run: flutter analyze --fatal-infos

      - name: Unit and widget tests
        run: flutter test

  windows:
    name: Windows · integration test · release build
    needs: analyze-test
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain
        working-directory: app/rust
        run: rustup toolchain install

      - name: Integration test (real Rust core)
        run: flutter test integration_test/app_test.dart -d windows

      - name: Release build
        run: flutter build windows --release

      - uses: actions/upload-artifact@v7
        with:
          name: zelamar-windows-x64
          path: app/build/windows/x64/runner/Release/
          retention-days: 14

  android:
    name: Android · emulator integration test
    needs: analyze-test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      # The emulator needs several GB for its userdata partition; Rust, Gradle
      # and Flutter fill the default runner disk. Drop toolchains we never use.
      - name: Free disk space
        working-directory: .
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain (incl. Android targets)
        working-directory: app/rust
        run: rustup toolchain install

      - name: Enable KVM for the emulator
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: flutter pub get

      - name: Integration test on emulator (real Rust core, screenshots)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          working-directory: app
          script: flutter drive --driver=test_driver/integration_test.dart --target=integration_test/app_test.dart

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots
          path: app/screenshots/
          if-no-files-found: warn
          retention-days: 14
