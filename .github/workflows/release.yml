name: Release (beta builds)

# Builds the beta apps against a delivery service, on demand:
#   gh workflow run release.yml
# Android: an APK signed with Zelamar's upload key (GitHub secrets
# ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD), so each beta
# installs over the previous one. Windows: the release folder, zipped.
# With `publish`, both become a GitHub pre-release that testers download:
#   gh workflow run release.yml -f publish=true
on:
  workflow_dispatch:
    inputs:
      service:
        description: Delivery service origin
        required: true
        default: https://zelamar-server.rivalmash-backend-workers.workers.dev
      publish:
        description: Publish a GitHub pre-release for testers
        type: boolean
        default: false

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.7"
  # SHA-256 of Zelamar's upload certificate: a beta signed with anything
  # else (such as a debug key) fails the build instead of shipping.
  UPLOAD_CERT_SHA256: cfd9be25603aaf6c88896c1cf3a8be58453e33f2e761c4d39f1b85db25a3f371

defaults:
  run:
    working-directory: app

jobs:
  android:
    name: Android · signed beta APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain (incl. Android targets)
        working-directory: app/rust
        run: rustup toolchain install

      - run: flutter pub get

      - name: Upload key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/upload.p12"

      - name: Build the APK (arm64, every phone of the last decade)
        env:
          ZELAMAR_KEYSTORE: ${{ runner.temp }}/upload.p12
          ZELAMAR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          SERVICE: ${{ inputs.service }}
          # Push wake-ups (ADR-0017): the Firebase app's public identifiers,
          # as repository variables. Without them the APK has no push.
          ZELAMAR_FIREBASE_APP_ID: ${{ vars.ZELAMAR_FIREBASE_APP_ID }}
          ZELAMAR_FIREBASE_API_KEY: ${{ vars.ZELAMAR_FIREBASE_API_KEY }}
          ZELAMAR_FIREBASE_PROJECT_ID: ${{ vars.ZELAMAR_FIREBASE_PROJECT_ID }}
          ZELAMAR_FIREBASE_SENDER_ID: ${{ vars.ZELAMAR_FIREBASE_SENDER_ID }}
        run: >
          flutter build apk --release --target-platform android-arm64
          --dart-define=ZELAMAR_SERVICE="$SERVICE"

      - name: Check the signature
        run: |
          apksigner=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          apk=build/app/outputs/flutter-apk/app-release.apk
          "$apksigner" verify --print-certs "$apk" | tee signature.txt
          grep -qi "SHA-256 digest: $UPLOAD_CERT_SHA256" signature.txt
          # A release build without INTERNET cannot reach the service.
          aapt2=$(ls "$ANDROID_HOME"/build-tools/*/aapt2 | sort -V | tail -1)
          "$aapt2" dump permissions "$apk" | tee permissions.txt
          grep -q "android.permission.INTERNET" permissions.txt
          version=$(grep '^version:' pubspec.yaml | cut -d' ' -f2 | tr '+' '-')
          mkdir -p dist
          cp "$apk" "dist/zelamar-$version-android-arm64.apk"
          rm -f "$RUNNER_TEMP/upload.p12"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zelamar-android
          path: app/dist/
          retention-days: 30

  windows:
    name: Windows · beta build
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain
        working-directory: app/rust
        run: rustup toolchain install

      - name: Build
        env:
          SERVICE: ${{ inputs.service }}
        run: flutter build windows --release --dart-define=ZELAMAR_SERVICE="$env:SERVICE"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: zelamar-windows-x64
          path: app/build/windows/x64/runner/Release/
          retention-days: 30

  publish:
    name: Publish the pre-release
    if: ${{ inputs.publish }}
    needs: [android, windows]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          path: artifacts

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(grep '^version:' app/pubspec.yaml | cut -d' ' -f2 | cut -d'+' -f1)
          build=$(grep '^version:' app/pubspec.yaml | cut -d' ' -f2 | tr '+' '-')
          mkdir -p dist
          cp artifacts/zelamar-android/*.apk dist/
          (cd artifacts/zelamar-windows-x64 && zip -qr "../../dist/zelamar-$build-windows-x64.zip" .)
          (cd dist && sha256sum * > SHA256SUMS.txt)
          {
            echo "Closed beta. Signing up needs an invite code."
            echo
            echo "- **Android:** install the APK; it updates earlier betas in place."
            echo "- **Windows:** unzip anywhere and run \`zelamar.exe\`."
            echo
            echo "SHA-256:"
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md
          gh release create "v$version" dist/* --target "$GITHUB_SHA" \
            --title "Zelamar $version (beta)" --notes-file notes.md --prerelease

