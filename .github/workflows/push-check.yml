name: Push check

# Push wake-ups end to end (ADR-0017): a local service holding the real
# Firebase key, an Android emulator with Google Play services, and the app.
# Run by hand after changing anything on the push path.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.7"

jobs:
  push:
    name: Android · push wake-up end to end
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ZELAMAR_FIREBASE_APP_ID: ${{ vars.ZELAMAR_FIREBASE_APP_ID }}
      ZELAMAR_FIREBASE_API_KEY: ${{ vars.ZELAMAR_FIREBASE_API_KEY }}
      ZELAMAR_FIREBASE_PROJECT_ID: ${{ vars.ZELAMAR_FIREBASE_PROJECT_ID }}
      ZELAMAR_FIREBASE_SENDER_ID: ${{ vars.ZELAMAR_FIREBASE_SENDER_ID }}
    steps:
      # The emulator needs several GB for its userdata partition; Rust, Gradle
      # and Flutter fill the default runner disk. Drop toolchains we never use.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: Install pinned Rust toolchain (incl. Android targets)
        working-directory: app/rust
        run: rustup toolchain install

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Local service with the real Firebase key
        working-directory: server
        env:
          FCM_SERVICE_ACCOUNT: ${{ secrets.FCM_SERVICE_ACCOUNT }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          npm ci
          key=$(openssl rand -hex 32)
          node -e '
            const account = JSON.stringify(JSON.parse(process.env.FCM_SERVICE_ACCOUNT));
            require("node:fs").writeFileSync(".dev.vars",
              `INVITE_KEY=${process.argv[1]}\nFCM_SERVICE_ACCOUNT=${"\x27"}${account}${"\x27"}\n`);
          ' "$key"
          invites=$(INVITE_KEY=$key node scripts/invites.mjs 1 2 | awk '{print $2}' | paste -sd, -)
          echo "ZELAMAR_TEST_INVITES=$invites" >> "$GITHUB_ENV"
          nohup npx wrangler dev --port 8787 > "$RUNNER_TEMP/wrangler.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf http://127.0.0.1:8787/health && exit 0
            sleep 2
          done
          cat "$RUNNER_TEMP/wrangler.log"
          exit 1

      - name: Fetch app packages
        working-directory: app
        run: flutter pub get

      - name: Push end to end on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # The emulator reaches the runner's loopback at 10.0.2.2.
          ZELAMAR_SERVICE: http://10.0.2.2:8787
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_7
          disk-size: 2048M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot-save -no-metrics
          working-directory: app
          script: bash tool/push_check.sh

      - name: Service log
        if: always()
        run: grep -E "mailboxes|deliver|push_failed|rror" "$RUNNER_TEMP/wrangler.log" | tail -n 40 || true

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: push-check
          path: app/screenshots/
          if-no-files-found: warn
          retention-days: 14
