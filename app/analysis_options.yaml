# Strict static analysis. CI runs `flutter analyze --fatal-infos`, so every
# lint below is effectively an error. See ADR-0006.
include: package:very_good_analysis/analysis_options.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  exclude:
    # Generated by flutter_rust_bridge_codegen; regenerated, never edited.
    - lib/src/rust/**
    - build/**
    - android/**
    - windows/**

linter:
  rules:
    # The app is not a published package; public API docs live on the Rust side.
    public_member_api_docs: false
