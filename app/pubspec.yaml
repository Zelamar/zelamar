name: zelamar
description: "Zelamar — private by design, beautiful by obsession."
publish_to: 'none'

# <semver>+<build number>. The build number becomes Android versionCode and
# the Windows file version suffix.
version: 0.1.8+9

environment:
  sdk: ^3.13.0

dependencies:
  audioplayers: ^6.8.1
  ffi: ^2.2.0
  file_selector: ^1.1.0
  flutter:
    sdk: flutter
  # Pinned exactly: Dart and Rust halves of the bridge must match.
  flutter_rust_bridge: 2.13.0
  flutter_rust_bridge_hooks: 2.13.0
  http: ^1.6.0
  image: ^4.12.0
  path_provider: ^2.1.6
  record: ^7.1.2
  share_plus: ^13.3.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  very_good_analysis: ^11.0.0

flutter:
  uses-material-design: true

  # Bundled variable fonts (SIL OFL 1.1, licenses in assets/fonts/licenses/).
  # Never fetched at runtime: a font CDN request would leak usage metadata.
  fonts:
    - family: CormorantGaramond
      fonts:
        - asset: assets/fonts/CormorantGaramond-Variable.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/Geist-Variable.ttf
    - family: GeistMono
      fonts:
        - asset: assets/fonts/GeistMono-Variable.ttf

  assets:
    - assets/fonts/licenses/
