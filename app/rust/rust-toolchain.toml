# Must match the repository root toolchain. The Native Assets build hook
# (native_toolchain_rust) requires an exact version for reproducible builds.
[toolchain]
channel = "1.99.0"
components = ["rustfmt", "clippy"]
profile = "minimal"
targets = [
  "aarch64-linux-android",
  "armv7-linux-androideabi",
  "x86_64-linux-android",
  "x86_64-pc-windows-msvc",
  # CI host: `flutter test` builds native assets for the machine it runs on.
  "x86_64-unknown-linux-gnu",
]
