# Dependency policy enforced in CI by cargo-deny. See ADR-0005.
# https://embarkstudios.github.io/cargo-deny/

[graph]
all-features = true

[advisories]
# Any known vulnerability or unmaintained crate fails the build.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licenses only. Copyleft (GPL, LGPL, AGPL) is intentionally absent:
# it would force us to open code we keep closed (ADR-0003, ADR-0005).
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]
confidence-threshold = 0.93
# The allow-list is policy, not inventory: entries may be unused today.
unused-allowed-license = "allow"

[licenses.private]
# Our own unpublished crates carry a proprietary license reference.
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
